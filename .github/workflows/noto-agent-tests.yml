name: Noto Agent - validação do PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/agente/**'
      - 'src/server.ts'
      - 'src/config.ts'
      - 'tests/agente*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/noto-agent-tests.yml'
  push:
    branches: [feat/noto-agent-entrega-a]
permissions:
  contents: write
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolver dependências e lockfile da Entrega A
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Persistir lockfile validado na branch de trabalho
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/noto-agent-entrega-a'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(agent): lock validated SDK dependencies'
            git push origin HEAD:feat/noto-agent-entrega-a
          fi
